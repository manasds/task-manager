services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orbittask
      POSTGRES_PASSWORD: orbittask
      POSTGRES_DB: orbittask
    ports:
      - "5432:5432"
    volumes:
      - orbittask_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbittask -d orbittask"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orbittask_pg:
